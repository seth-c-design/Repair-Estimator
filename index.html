    <script>
        // === BUCKETS DATA (12 full categories) ===
        let bucketsData = [ /* ... same 12 buckets as before ... */ ];

        let procurementItems = [];
        let laborRate = 100;
        let currentFilter = '';

        // ... (all the functions: calculateTotals, renderBuckets, toggleBucket, procurement functions, rate presets, demo, clearAll, preview functions) ...

        // ====================== FULL TRELLO FUNCTION ======================
        async function createTrelloCard() {
            const apiKey = document.getElementById('trello-key').value.trim();
            const token = document.getElementById('trello-token').value.trim();
            const listId = document.getElementById('trello-list-id').value.trim();

            if (!apiKey || !token || !listId) {
                alert("❌ Missing Trello credentials. Please fill all three fields.");
                return;
            }

            const projectName = document.getElementById('project-name').value || "Untitled Restoration";
            const customerName = document.getElementById('customer-name').value || "Client";
            const notes = document.getElementById('notes').value || "";
            const totalHours = document.getElementById('total-hours').textContent;
            const totalLabor = document.getElementById('total-labor').textContent;
            const totalMaterials = document.getElementById('total-materials').textContent;
            const grandTotal = document.getElementById('grand-total').textContent;

            // Build description
            let desc = `**Project:** ${projectName}\n`;
            desc += `**Customer:** ${customerName}\n\n`;
            desc += `**Hours:** ${totalHours} | **Labor:** ${totalLabor} | **Materials:** ${totalMaterials} | **Total:** ${grandTotal}\n\n`;
            if (notes) desc += `**Notes:** ${notes}\n\n`;

            if (procurementItems.length > 0) {
                desc += "**Procurement Items:**\n";
                procurementItems.forEach(item => {
                    const line = (parseFloat(item.qty)||1) * (parseFloat(item.cost)||0);
                    desc += `- ${item.name} × ${item.qty} = $${line}\n`;
                });
            }

            try {
                // Create Card
                const cardRes = await fetch(`https://api.trello.com/1/cards?key=${apiKey}&token=${token}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        name: `${projectName} — ${customerName}`,
                        desc: desc,
                        idList: listId,
                        pos: 'bottom'
                    })
                });

                if (!cardRes.ok) throw new Error("Failed to create card");

                const card = await cardRes.json();

                // Create Checklist
                const checklistRes = await fetch(`https://api.trello.com/1/checklists?key=${apiKey}&token=${token}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ idCard: card.id, name: "🔧 Restoration Process Checklist" })
                });

                const checklist = await checklistRes.json();

                // Add checked steps to checklist
                document.querySelectorAll('.step-row input[type="checkbox"]:checked').forEach(chk => {
                    const labelEl = chk.parentElement.querySelector('label');
                    const hoursEl = chk.parentElement.querySelector('input[type="number"]');
                    const label = labelEl ? labelEl.textContent.trim() : "Step";
                    const hours = hoursEl ? parseFloat(hoursEl.value) || 0 : 0;
                    const itemText = hours > 0 ? `${label} (${hours} hrs)` : label;

                    fetch(`https://api.trello.com/1/checklists/${checklist.id}/checkItems?key=${apiKey}&token=${token}`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ name: itemText })
                    });
                });

                alert(`✅ Success! Trello card created.\n\nLink: https://trello.com/c/${card.shortLink}`);
                hideTrelloModal();

            } catch (err) {
                console.error(err);
                alert("❌ Failed to create Trello card. Check console (F12) for details.\nCommon issues: invalid token or wrong List ID.");
            }
        }

        // Rest of your functions (renderBuckets, etc.) + initializeApp
        function initializeApp() {
            createRatePresets();
            renderBuckets();
            renderProcurement();
            calculateTotals();
            console.log('%c✅ RestorMate v3.1 Trello-Ready loaded!', 'color:#10b981; font-weight:600');
        }

        window.onload = initializeApp;
    </script>
